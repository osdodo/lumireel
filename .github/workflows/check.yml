name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libwayland-dev libvulkan-dev libfontconfig1-dev \
            libasound2-dev libudev-dev ffmpeg
      - name: Install macOS audio test dependency
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - uses: Swatinem/rust-cache@v2
      - name: Check all Rust targets
        run: cargo check --all-targets --locked
      - name: Test Rust
        run: cargo test --locked
      - name: Test preview audio lifecycle
        run: node --test tests/host-audio.test.cjs
